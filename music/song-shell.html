    <script>
      (function () {
        var route = new URLSearchParams(window.location.search).get('__jp_route');
        if (!route || !window.history || typeof window.history.replaceState !== 'function') {
          return;
        }
        try {
          var target = new URL(route, window.location.origin);
          if (target.origin === window.location.origin && /^\/music\//i.test(target.pathname)) {
            window.history.replaceState(null, document.title, target.pathname + target.search + target.hash);
          }
        } catch (_error) {
          return;
        }
      })();
    </script>
