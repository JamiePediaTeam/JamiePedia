    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://jamiepediateam.github.io/JamiePedia/music/ccontrepoint/rawdog.html">
    <meta property="twitter:title" content="Template">
    <meta property="twitter:description" content="JamiePedia is an encyclopedia of musician and songwriter Jamie Paige, a pedantry prose of pure perception.">
    <meta property="twitter:image" content="../../public/images/cover-art/cc.png">
    <meta name="theme-color" content="#F05E55">
    <link rel="icon" type="image/x-icon" href="../../public/images/favicon.ico">
    <link href="../../styles.css" rel="stylesheet" type="text/css" media="all">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="../../assets/static/load.js"></script>
    <link href="../../css/song.css" rel="stylesheet" type="text/css" media="all">
    <script src="../../assets/static/song.js"></script>
  </head>
  <body>
  <a href="../../"><div class="head"></div></a>
  <div class="navi">
  <span id="navi"></span>
  </div>
  <div class="song-page-wrapper">
    <div class="song-sidebar-col">
      <div class="sidebar1">
        <span id="sidebar"></span>
      </div>
    </div>
    
    <div class="song-main-col">
      <div class="song-tabs-container">
        <div class="song-tabs">
          <button class="song-tab active" onclick="switchTab('summary')">Summary</button>
          <button class="song-tab" onclick="switchTab('lyrics')">Lyrics</button>
          <button class="song-tab" onclick="switchTab('motifs')">Connections</button>
          <button class="song-tab" onclick="switchTab('extended')">Extended Info</button>

          <div class="tabs-spacer"></div>


        </div>
      </div>
      
      <div class="bodybar">
        <div class="version-wrapper">
          <div id="version-original" class="song-container">
          <!-- Left View -->
          <div class="song-leftview">
            <h1 class="song-title"></h1>
            <p class="song-length"></p>

            <!-- Tab Content -->
            <div id="content-lyrics" class="song-content active">
              <div id="lyrics-annotated" class="lyrics-content active"></div>

              
              
            </div>
            
            <div id="content-motifs" class="song-content"></div>
            
            <div id="content-summary" class="song-content"></div>
            
            <div id="content-extended" class="song-content"></div>
          </div>

            <div class="song-rightview">
              <div class="album-tabs-container">
                <div class="album-tabs"></div>
              </div>
              <div class="song-cover"></div>
              <div class="cover-art-footer">
                <div class="cover-art-credit">Cover art by: <span id="cover-artist-display"></span></div>
              </div>
              <div class="song-nav-buttons"></div>
            </div>
          </div>
        
          <!-- Alternative Version -->
          <div id="version-alt1" class="song-container" style="display: none;">
            <!-- Left View -->
            <div class="song-leftview">
              <h1 class="song-title"></h1>
              <p class="song-length"></p>

              <!-- Tab Content -->
              <div id="content-lyrics-alt1" class="song-content active">
                <div id="lyrics-annotated-alt1" class="lyrics-content active"></div>
                
                
              </div>
              
              <div id="content-motifs-alt1" class="song-content"></div>
              
              <div id="content-summary-alt1" class="song-content"></div>
              
              <div id="content-extended-alt1" class="song-content"></div>
            </div>
            
            <!-- Right View -->
            <div class="song-rightview">
              <div class="album-tabs-container">
                <div class="album-tabs"></div>
              </div>
              <div class="song-cover"></div>
              <div class="cover-art-footer">
                  <div class="cover-art-credit">Cover art by: <span id="cover-artist-display-alt1"></span></div>
              </div>
              <div class="song-nav-buttons"></div>
            </div>
  </body>
</html>
