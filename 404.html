<!DOCTYPE html>
<html lang="en" data-theme-id="grayscale">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Paige not found</title>
    <meta name="title" content="404 Paige not found">
    <meta name="description" content="The page you requested could not be found.">
    <meta name="theme-color" content="#F05E55">
    <link rel="icon" type="image/x-icon" href="/public/images/favicon.ico">
    <link href="/styles.css" rel="stylesheet" type="text/css" media="all">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="/assets/static/load.js"></script>
    <style>
      .not-found-layout {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .not-found-copy {
        flex: 1 1 auto;
        min-width: 0;
      }

      .not-found-copy h1 {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .not-found-copy p {
        margin-top: 0;
      }

      .not-found-image-wrap {
        flex: 0 0 220px;
        text-align: right;
      }

      .not-found-image {
        width: 220px;
        max-width: 100%;
        height: auto;
        border: 3px solid var(--theme-color-brand_frame);
        border-radius: 6px;
      }

      @media (max-width: 760px) {
        .not-found-layout {
          flex-direction: column;
          align-items: flex-start;
        }

        .not-found-image-wrap {
          width: 100%;
          text-align: left;
        }
      }
    </style>
  </head>
  <body class="not-found-booting">
    <a href="/"><div class="head"></div></a>
    <div class="navi">
      <span id="navi"></span>
    </div>

    <table class="table">
      <tr>
        <td>
          <div class="sidebar1">
            <span id="sidebar"></span>
          </div>
        </td>
        <td>
          <div class="bodybar" id="notFoundBody">
            <div class="not-found-layout" id="notFoundPageContent">
              <div class="not-found-copy">
                <h1>404 - Paige not found</h1>
                <p><a href="/">Go back home</a></p>
              </div>
              <div class="not-found-image-wrap">
                <img class="not-found-image" src="/public/images/tetodead.png" alt="Tetodead image">
              </div>
            </div>
          </div>
        </td>
      </tr>
    </table>

    <script>
      (function () {
        function getSiteBase(pathname) {
          var source = String(pathname || '');
          return source.indexOf('/JamiePedia/') !== -1 ? '/JamiePedia' : '';
        }

        function stripSiteBase(pathname, siteBase) {
          var source = String(pathname || '/');
          if (!source.startsWith('/')) {
            source = '/' + source;
          }

          if (siteBase && source === siteBase) {
            return '/';
          }

          if (siteBase && source.indexOf(siteBase + '/') === 0) {
            return source.slice(siteBase.length) || '/';
          }

          return source;
        }

        function withSiteBase(pathname, siteBase) {
          var source = String(pathname || '/');
          if (!source.startsWith('/')) {
            source = '/' + source;
          }

          if (!siteBase) {
            return source;
          }

          if (source === '/') {
            return siteBase + '/';
          }

          if (source === siteBase || source.indexOf(siteBase + '/') === 0) {
            return source;
          }

          return siteBase + source;
        }

        function toExtensionlessPath(pathname) {
          var source = String(pathname || '/').split('?')[0].split('#')[0];
          if (!source.startsWith('/')) {
            source = '/' + source;
          }

          if (source === '/index.html') {
            return '/';
          }

          source = source.replace(/\/index\.html$/i, '/').replace(/\.html$/i, '');
          if (source.length > 1 && source.endsWith('/')) {
            source = source.slice(0, -1);
          }

          return source || '/';
        }

        function getRouteParts(pathname) {
          return toExtensionlessPath(pathname).split('/').filter(Boolean);
        }

        function hasKnownSectionRoute(normalizedPath, knownRoutes, sectionTokens, prefix) {
          var parts = getRouteParts(normalizedPath);
          if (parts.length !== 3 || parts[0] !== prefix || !sectionTokens.has(String(parts[2] || '').toLowerCase())) {
            return false;
          }

          return knownRoutes.has('/' + parts[0] + '/' + parts[1]);
        }

        function splitCsvLine(line) {
          var values = [];
          var current = '';
          var inQuotes = false;

          for (var index = 0; index < line.length; index += 1) {
            var char = line[index];
            var next = line[index + 1];

            if (char === '"') {
              if (inQuotes && next === '"') {
                current += '"';
                index += 1;
              } else {
                inQuotes = !inQuotes;
              }
              continue;
            }

            if (char === ',' && !inQuotes) {
              values.push(current);
              current = '';
              continue;
            }

            current += char;
          }

          values.push(current);
          return values.map(function (value) { return String(value || '').trim(); });
        }

        function parseCsvRows(text) {
          var lines = String(text || '')
            .split(/\r?\n/)
            .map(function (line) { return line.trim(); })
            .filter(Boolean);

          if (lines.length < 2) {
            return { headers: [], rows: [] };
          }

          var headers = splitCsvLine(lines[0]).map(function (header) { return header.toLowerCase(); });
          var rows = [];
          for (var index = 1; index < lines.length; index += 1) {
            rows.push(splitCsvLine(lines[index]));
          }

          return { headers: headers, rows: rows };
        }

        function normalizeSongRoutePath(rawPath) {
          var source = String(rawPath || '').trim();
          if (!source) {
            return '';
          }

          var hashless = source.split('#')[0].split('?')[0].trim();
          if (!hashless) {
            return '';
          }

          var withMusicPrefix = hashless.indexOf('/music/') === 0
            ? hashless
            : '/music/' + hashless.replace(/^\/+/, '');

          var normalized = withMusicPrefix.replace(/\.html$/i, '').replace(/\/index$/i, '');
          if (normalized.length > 1) {
            normalized = normalized.replace(/\/+$/, '');
          }

          return normalized || '/';
        }

        function normalizeCloseupRoutePath(rawPath) {
          var source = String(rawPath || '').trim();
          if (!source) {
            return '';
          }

          var hashless = source.split('#')[0].split('?')[0].trim();
          if (!hashless) {
            return '';
          }

          var withMusicPrefix = hashless.indexOf('/music/') === 0
            ? hashless
            : '/music/' + hashless.replace(/^\/+/, '');

          var normalized = withMusicPrefix.replace(/\.html$/i, '').replace(/\/index$/i, '');
          if (normalized.length > 1) {
            normalized = normalized.replace(/\/+$/, '');
          }

          if (!/^\/music\/[^/]+\/close-up$/i.test(normalized)) {
            return '';
          }

          return normalized;
        }

        function getSongSectionHrefFromCloseupRoute(rawPath) {
          var normalized = normalizeCloseupRoutePath(rawPath);
          if (!normalized) {
            return '';
          }

          var match = normalized.match(/^\/music\/([^/]+)\/close-up$/i);
          var slug = match && match[1] ? String(match[1]).trim().toLowerCase() : '';
          if (!slug) {
            return '';
          }

          return '/music/' + slug + '/close-up';
        }

        function normalizeAlbumRoutePath(rawPath) {
          var normalized = normalizeSongRoutePath(rawPath);
          if (!/^\/music\/[^/]+$/.test(normalized) || normalized === '/music') {
            return '';
          }
          return normalized;
        }

        function normalizeMotifRoutePath(rawPath) {
          var source = String(rawPath || '').trim();
          if (!source) {
            return '';
          }

          var hashless = source.split('#')[0].split('?')[0].trim();
          if (!hashless) {
            return '';
          }

          var withPrefix = hashless.indexOf('/motifs/') === 0
            ? hashless
            : '/motifs/' + hashless.replace(/^\/+/, '');

          var normalized = withPrefix.replace(/\.html$/i, '').replace(/\/index$/i, '');
          if (normalized.length > 1) {
            normalized = normalized.replace(/\/+$/, '');
          }

          if (!/^\/motifs\/[^/]+$/.test(normalized) || normalized === '/motifs') {
            return '';
          }

          return normalized;
        }

        function normalizeArtistRoutePath(rawPath) {
          var source = String(rawPath || '').trim();
          if (!source) {
            return '';
          }

          var hashless = source.split('#')[0].split('?')[0].trim();
          if (!hashless) {
            return '';
          }

          var withPrefix = hashless.indexOf('/artists/') === 0
            ? hashless
            : '/artists/' + hashless.replace(/^\/+/, '');

          var normalized = withPrefix.replace(/\.html$/i, '').replace(/\/index$/i, '');
          if (normalized.length > 1) {
            normalized = normalized.replace(/\/+$/, '');
          }

          if (!/^\/artists\/[^/]+$/.test(normalized) || normalized === '/artists') {
            return '';
          }

          return normalized;
        }

        function normalizeArtistPageSlug(value) {
          return String(value || '')
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
        }

        function splitArtistPageId(value) {
          var raw = String(value || '').trim();
          if (!raw) {
            return { pageId: '', hashToken: '' };
          }

          var splitIndex = raw.indexOf('#');
          return {
            pageId: splitIndex === -1 ? raw : raw.slice(0, splitIndex),
            hashToken: splitIndex === -1 ? '' : raw.slice(splitIndex + 1).trim()
          };
        }

        function getSourcePath(pathname) {
          return String(pathname || '').replace(/\/raw\/?$/i, '');
        }

        function getSongSlug(sourcePath) {
          var file = String(sourcePath || '').split('/').pop() || '';
          return file.replace(/\.html$/i, '').toLowerCase();
        }

        function parseLrcRawLines(text) {
          var lines = String(text || '').split(/\r?\n/);
          var entries = [];

          lines.forEach(function (line) {
            var timestamps = line.match(/\[(\d{1,2}:\d{2}(?:\.\d{1,3})?)\]/g);
            if (!timestamps) {
              return;
            }

            var lyric = line.replace(/\[[^\]]+\]/g, '').trim();
            timestamps.forEach(function (stamp) {
              var clean = stamp.slice(1, -1);
              var match = clean.match(/^(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?$/);
              if (!match) {
                return;
              }

              var mins = Number(match[1]);
              var secs = Number(match[2]);
              var frac = Number('0.' + String(match[3] || '0').padEnd(3, '0'));
              entries.push({
                time: mins * 60 + secs + frac,
                text: lyric
              });
            });
          });

          var seen = new Set();
          return entries
            .sort(function (a, b) { return a.time - b.time; })
            .filter(function (entry) {
              var key = entry.time.toFixed(3) + '|' + entry.text;
              if (seen.has(key)) {
                return false;
              }
              seen.add(key);
              return true;
            })
            .map(function (entry) { return entry.text; });
        }

        function renderRawText(text, title) {
          document.title = title;
          document.body.innerHTML = '';
          var pre = document.createElement('pre');
          pre.textContent = text;
          pre.style.margin = '0';
          pre.style.whiteSpace = 'pre-wrap';
          pre.style.fontFamily = 'Nunito, sans-serif';
          pre.style.padding = '24px';
          document.body.appendChild(pre);
        }

        async function fetchText(pathname) {
          try {
            var response = await fetch(pathname, { cache: 'no-store' });
            if (!response.ok) {
              return '';
            }
            return await response.text();
          } catch (_error) {
            return '';
          }
        }

        function redirectToShell(shellPath, pathWithoutBase, siteBase) {
          var requestedRoute = pathWithoutBase + window.location.search + window.location.hash;
          var shellHref = withSiteBase(shellPath, siteBase) + '?__jp_route=' + encodeURIComponent(requestedRoute);
          window.location.replace(shellHref);
          return true;
        }

        async function tryRenderStaticExtensionlessRoute(pathWithoutBase, siteBase) {
          var normalized = toExtensionlessPath(pathWithoutBase);
          if (normalized === '/') {
            return false;
          }

          var candidates = [normalized + '.html', normalized + '/index.html'];
          for (var index = 0; index < candidates.length; index += 1) {
            var html = await fetchText(withSiteBase(candidates[index], siteBase));
            if (html) {
              return renderShellHtml(html);
            }
          }

          return false;
        }

        async function getKnownSongRoutes(siteBase) {
          var text = await fetchText(withSiteBase('/public/csv/JamiePedia Data - Songs.csv', siteBase));
          if (!text) {
            return new Set();
          }

          var parsed = parseCsvRows(text);
          var headers = parsed.headers;
          var rows = parsed.rows;
          var knownRoutes = new Set();
          var pathIndex = headers.findIndex(function (header) {
            return ['path id', 'path_id', 'path', 'page_path'].includes(header);
          });
          var albumIdIndex = headers.findIndex(function (header) {
            return ['album_id', 'album id'].includes(header);
          });

          if (pathIndex === -1) {
            return knownRoutes;
          }

          rows.forEach(function (values) {
            var rawPath = String(values[pathIndex] || '').trim();
            var normalized = normalizeSongRoutePath(rawPath);
            if (!normalized) {
              return;
            }

            knownRoutes.add(normalized);

            if (albumIdIndex === -1 || normalized.indexOf('/', '/music/'.length) !== -1) {
              return;
            }

            var baseSlug = normalized.replace(/^\/music\//, '');
            String(values[albumIdIndex] || '')
              .split(/\s*\|\s*/)
              .map(function (value) { return String(value || '').trim(); })
              .filter(function (value) { return value && value.toLowerCase() !== 'x'; })
              .forEach(function (albumId) {
                var legacy = normalizeSongRoutePath('/music/' + albumId + '/' + baseSlug);
                if (legacy) {
                  knownRoutes.add(legacy);
                }
              });
          });

          return knownRoutes;
        }

        async function hasKnownCloseupRoute(normalizedPath, siteBase) {
          var normalized = normalizeCloseupRoutePath(normalizedPath);
          if (!normalized) {
            return false;
          }

          var match = normalized.match(/^\/music\/([^/]+)\/close-up$/i);
          var songSlug = match && match[1] ? String(match[1]).trim() : '';
          if (!songSlug) {
            return false;
          }

          var text = await fetchText(withSiteBase('/public/close ups/text/' + songSlug + '.txt', siteBase));
          return Boolean(text);
        }

        async function getKnownAlbumRoutes(siteBase) {
          var text = await fetchText(withSiteBase('/public/csv/JamiePedia Data - Albums.csv', siteBase));
          if (!text) {
            return new Set();
          }

          var parsed = parseCsvRows(text);
          var headers = parsed.headers;
          var rows = parsed.rows;
          var knownRoutes = new Set();
          var pathIndex = headers.findIndex(function (header) {
            return ['album_id', 'album id', 'path id', 'path_id', 'path', 'page_path'].includes(header);
          });

          if (pathIndex === -1) {
            return knownRoutes;
          }

          rows.forEach(function (values) {
            var normalized = normalizeAlbumRoutePath(values[pathIndex] || '');
            if (normalized) {
              knownRoutes.add(normalized);
            }
          });

          return knownRoutes;
        }

        async function getKnownMotifRoutes(siteBase) {
          var text = await fetchText(withSiteBase('/public/csv/JamiePedia Data - Motifs.csv', siteBase));
          if (!text) {
            return new Set();
          }

          var parsed = parseCsvRows(text);
          var headers = parsed.headers;
          var rows = parsed.rows;
          var knownRoutes = new Set();
          var motifIdIndex = headers.indexOf('motif id');
          var categoryIdIndex = headers.indexOf('category id');
          var hasPageIndex = headers.indexOf('has page');

          if (hasPageIndex === -1) {
            return knownRoutes;
          }

          rows.forEach(function (values) {
            var motifId = String(values[motifIdIndex] || '').trim();
            var categoryId = String(values[categoryIdIndex] || '').trim();
            var hasPage = String(values[hasPageIndex] || '').trim().toUpperCase();

            if (!motifId || ['TRUE', 'YES', '1'].indexOf(hasPage) === -1) {
              return;
            }

            var pageSlug = categoryId === 'kalia-vibte'
              ? 'kalia-vibte'
              : (categoryId || motifId);

            var normalized = normalizeMotifRoutePath('/motifs/' + pageSlug);
            if (normalized) {
              knownRoutes.add(normalized);
            }
          });

          return knownRoutes;
        }

        async function getKnownArtistRoutes(siteBase) {
          var text = await fetchText(withSiteBase('/public/csv/JamiePedia Data - Artists.csv', siteBase));
          if (!text) {
            return new Set();
          }

          var parsed = parseCsvRows(text);
          var headers = parsed.headers;
          var rows = parsed.rows;
          var knownRoutes = new Set();
          var artistIdIndex = headers.indexOf('artist id');
          var hasPageIndex = headers.indexOf('has page?') !== -1 ? headers.indexOf('has page?') : headers.indexOf('has page');

          if (artistIdIndex === -1) {
            return knownRoutes;
          }

          rows.forEach(function (values) {
            var artistIds = String(values[artistIdIndex] || '').split(/\s*\|\s*/);
            var firstArtistId = String(artistIds[0] || '').trim();
            var hasPage = String(values[hasPageIndex] || '').trim().toUpperCase();
            if (!(hasPage === 'TRUE' || hasPage === 'YES' || hasPage === '1' || hasPage === '')) {
              return;
            }

            var pageId = splitArtistPageId(firstArtistId).pageId || firstArtistId;
            var slug = normalizeArtistPageSlug(pageId);
            var legacySlug = normalizeArtistPageSlug(firstArtistId);
            var normalized = normalizeArtistRoutePath('/artists/' + slug);
            if (normalized) {
              knownRoutes.add(normalized);
            }

            if (legacySlug && legacySlug !== slug) {
              var legacyNormalized = normalizeArtistRoutePath('/artists/' + legacySlug);
              if (legacyNormalized) {
                knownRoutes.add(legacyNormalized);
              }
            }
          });

          return knownRoutes;
        }

        async function bootstrapGithubPagesRoute() {
          var revealTimer = null;

          function revealNotFoundBody() {
            if (document.body) {
              document.body.classList.remove('not-found-booting');
            }

            if (revealTimer) {
              clearTimeout(revealTimer);
              revealTimer = null;
            }
          }

          revealTimer = setTimeout(function () {
            revealNotFoundBody();
          }, 4500);

          var fullPath = window.location.pathname || '/';
          var siteBase = getSiteBase(fullPath);
          var pathWithoutBase = stripSiteBase(fullPath, siteBase);
          var rawRouteRequested = /\/raw\/?$/i.test(pathWithoutBase);

          if (rawRouteRequested) {
            var sourcePath = getSourcePath(pathWithoutBase);
            var slug = getSongSlug(sourcePath);
            if (!slug) {
              renderRawText('Raw lyrics unavailable.', 'Raw Lyrics');
              return;
            }

            var lyricsPath = withSiteBase('/public/lyrics/' + slug + '.lrc', siteBase);
            var lyricsText = await fetchText(lyricsPath);
            if (!lyricsText) {
              renderRawText('This song has no raw lyrics.', slug + ' raw lyrics');
              return;
            }

            var rawLines = parseLrcRawLines(lyricsText);
            renderRawText(rawLines.length > 0 ? rawLines.join('\n') : 'This song has no raw lyrics.', slug + ' raw lyrics');
            return;
          }

          var normalized = toExtensionlessPath(pathWithoutBase);
          if (normalized.indexOf('/music/') === 0) {
            var albumRoutes = await getKnownAlbumRoutes(siteBase);
            var albumSections = new Set(['tracklist', 'summary', 'extended']);
            if (albumRoutes.has(normalized) || hasKnownSectionRoute(normalized, albumRoutes, albumSections, 'music')) {
              redirectToShell('/music/album-shell.html', pathWithoutBase, siteBase);
              return;
            }

            var songRoutes = await getKnownSongRoutes(siteBase);
            var songSections = new Set(['connections', 'motifs', 'summary', 'lyrics', 'extended', 'close-up', 'closeup']);
            if (songRoutes.has(normalized) || hasKnownSectionRoute(normalized, songRoutes, songSections, 'music')) {
              redirectToShell('/music/song-shell.html', pathWithoutBase, siteBase);
              return;
            }

            if (await tryRenderStaticExtensionlessRoute(pathWithoutBase, siteBase)) {
              return;
            }

            revealNotFoundBody();
            return;
          }

          if (normalized.indexOf('/motifs/') === 0) {
            var motifRoutes = await getKnownMotifRoutes(siteBase);
            if (motifRoutes.has(normalized)) {
              redirectToShell('/motifs/motif-shell.html', pathWithoutBase, siteBase);
              return;
            }

            if (await tryRenderStaticExtensionlessRoute(pathWithoutBase, siteBase)) {
              return;
            }

            revealNotFoundBody();
            return;
          }

          if (normalized.indexOf('/artists/') === 0) {
            var artistRoutes = await getKnownArtistRoutes(siteBase);
            var artistSections = new Set(['credits', 'summary']);
            if (artistRoutes.has(normalized) || hasKnownSectionRoute(normalized, artistRoutes, artistSections, 'artists')) {
              redirectToShell('/artists/artist-shell.html', pathWithoutBase, siteBase);
              return;
            }

            if (await tryRenderStaticExtensionlessRoute(pathWithoutBase, siteBase)) {
              return;
            }

            revealNotFoundBody();
            return;
          }

          if (await tryRenderStaticExtensionlessRoute(pathWithoutBase, siteBase)) {
            return;
          }

          revealNotFoundBody();
        }

        bootstrapGithubPagesRoute().catch(function () {
          if (document.body) {
            document.body.classList.remove('not-found-booting');
          }
        });
      })();
    </script>
  </body>
