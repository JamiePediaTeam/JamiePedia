<!DOCTYPE html>
<html lang="en" data-theme-id="grayscale">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Paige not found</title>
    <meta name="title" content="404 Paige not found">
    <meta name="description" content="The page you requested could not be found.">
    <meta name="theme-color" content="#F05E55">
    <link rel="icon" type="image/x-icon" href="/public/images/favicon.ico">
    <link href="/styles.css" rel="stylesheet" type="text/css" media="all">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="/assets/static/load.js"></script>
    <style>
      body {
        background: transparent;
      }

      .not-found-layout {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .not-found-copy {
        flex: 1 1 auto;
        min-width: 0;
      }

      .not-found-copy h1 {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .not-found-copy p {
        margin-top: 0;
      }

      .not-found-image-wrap {
        flex: 0 0 220px;
        text-align: right;
      }

      .not-found-image {
        width: 220px;
        max-width: 100%;
        height: auto;
        border: 3px solid var(--theme-color-brand_frame);
        border-radius: 6px;
        background: var(--theme-color-background_base);
      }

      @media (max-width: 760px) {
        .not-found-layout {
          flex-direction: column;
          align-items: flex-start;
        }

        .not-found-image-wrap {
          width: 100%;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <a href="/"><div class="head"></div></a>
    <div class="navi">
      <span id="navi"></span>
    </div>

    <table class="table">
      <tr>
        <td>
          <div class="sidebar1">
            <span id="sidebar"></span>
          </div>
        </td>
        <td>
          <div class="bodybar" id="notFoundBody">
            <div class="not-found-layout" id="notFoundPageContent">
              <div class="not-found-copy">
                <h1>404 - Paige not found</h1>
                <p><a href="/">Go back home</a></p>
              </div>
              <div class="not-found-image-wrap">
                <img class="not-found-image" src="/public/images/tetodead.png" alt="Tetodead image">
              </div>
            </div>
          </div>
        </td>
      </tr>
    </table>

    <script>
      (function () {
        function getSourcePath(pathname) {
          return String(pathname || '').replace(/\/raw\/?$/i, '');
        }

        function getSiteBase(pathname) {
          const parts = String(pathname || '').split('/').filter(Boolean);
          const musicIndex = parts.indexOf('music');
          if (musicIndex > 0) {
            return '/' + parts.slice(0, musicIndex).join('/');
          }
          return '';
        }

        function getSongSlug(sourcePath) {
          const file = String(sourcePath || '').split('/').pop() || '';
          return file.replace(/\.html$/i, '').toLowerCase();
        }

        function parseLrcRawLines(text) {
          const lines = String(text || '').split(/\r?\n/);
          const entries = [];

          lines.forEach(function (line) {
            const timestamps = line.match(/\[(\d{1,2}:\d{2}(?:\.\d{1,3})?)\]/g);
            if (!timestamps) {
              return;
            }

            const lyric = line.replace(/\[[^\]]+\]/g, '').trim();
            timestamps.forEach(function (stamp) {
              const clean = stamp.slice(1, -1);
              const match = clean.match(/^(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?$/);
              if (!match) {
                return;
              }

              const mins = Number(match[1]);
              const secs = Number(match[2]);
              const frac = Number('0.' + String(match[3] || '0').padEnd(3, '0'));
              entries.push({
                time: mins * 60 + secs + frac,
                text: lyric
              });
            });
          });

          const seen = new Set();
          return entries
            .sort(function (a, b) { return a.time - b.time; })
            .filter(function (entry) {
              const key = entry.time.toFixed(3) + '|' + entry.text;
              if (seen.has(key)) {
                return false;
              }
              seen.add(key);
              return true;
            })
            .map(function (entry) { return entry.text; });
        }

        function renderRawText(text, title) {
          document.title = title;
          document.body.innerHTML = '';
          var pre = document.createElement('pre');
          pre.textContent = text;
          pre.style.margin = '0';
          pre.style.whiteSpace = 'pre-wrap';
          pre.style.fontFamily = 'Nunito, sans-serif';
          pre.style.padding = '24px';
          document.body.appendChild(pre);
        }

        var path = window.location.pathname || '';
        if (!/\/raw\/?$/i.test(path)) {
          return;
        }

        var sourcePath = getSourcePath(path);
        var slug = getSongSlug(sourcePath);
        if (!slug) {
          renderRawText('Raw lyrics unavailable.', 'Raw Lyrics');
          return;
        }

        var lyricsPath = getSiteBase(path) + '/public/lyrics/' + slug + '.lrc';
        fetch(lyricsPath, { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) {
              throw new Error('Missing lyrics');
            }
            return response.text();
          })
          .then(function (text) {
            var rawLines = parseLrcRawLines(text);
            renderRawText(rawLines.length > 0 ? rawLines.join('\n') : 'This song has no raw lyrics.', slug + ' raw lyrics');
          })
          .catch(function () {
            renderRawText('This song has no raw lyrics.', slug + ' raw lyrics');
          });
      })();
    </script>
  </body>
</html>
