<!DOCTYPE html>
<html data-theme-id="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motifs</title>
    <meta name="title" content="Motifs" />
    <meta
      name="description"
      content="Browse motif pages and references across Jamie Paige songs." />

    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:image"
      content="https://jamiepedia.page/JamiePedia/public/images/placeholder.png" />
    <meta name="theme-color" content="#F05E55" />
    <link rel="icon" type="image/x-icon" href="public/images/favicon.ico" />
    <link href="styles.css" rel="stylesheet" type="text/css" media="all" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800" />
    <script
      src="https://code.jquery.com/jquery-3.6.0.min.js"
      integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
      crossorigin="anonymous"
    ></script>
    <script src="assets/static/load.js"></script>
    <link href="css/music.css" rel="stylesheet" type="text/css" media="all" />
    <meta name="robots" content="index,follow" /><meta property="og:type" content="website" /><meta
      property="og:url"
      content="https://jamiepedia.page/motifs/" /><meta property="og:title" content="Motifs" /><meta
      property="og:description"
      content="Browse motif pages and references across Jamie Paige songs." /><meta
      name="twitter:url"
      content="https://jamiepedia.page/motifs/" /><meta
      name="twitter:title"
      content="Motifs" /><meta
      name="twitter:description"
      content="Browse motif pages and references across Jamie Paige songs." /><link
      rel="canonical"
      href="https://jamiepedia.page/motifs/"
  /></head>
  <body>
    <a href="./"><div class="head"></div></a>
    <div class="navi">
      <span id="navi"></span>
    </div>

    <table class="table">
      <tr>
        <td>
          <div class="sidebar1">
            <span id="sidebar"></span>
          </div>
        </td>
        <td>
          <div class="bodybar">
            <div id="motifSections"></div>
          </div>
        </td>
      </tr>
    </table>
    <script src="assets/static/csv-data.js"></script>
    <script>
      (async function () {
        function resolveMotifImagePath(rawPath) {
          const text = String(rawPath || "").trim();
          if (!text) {
            return "public/images/placeholder.png";
          }

          if (/^https?:\/\//i.test(text) || text.startsWith("data:")) {
            return text;
          }

          if (text.startsWith("../public/")) {
            return text.replace(/^\.\.\//, "");
          }

          return text;
        }

        function createMotifTile(group) {
          const tile = document.createElement("div");
          tile.className = "album-tile";

          const link = document.createElement("a");
          link.href = "motifs/" + (group.pageSlug || group.id);
          tile.appendChild(link);

          const members = Array.isArray(group.members) ? group.members : [];
          const motif = members.find((item) => item && item.image) || members[0] || group;
          const image = document.createElement("img");
          image.className = "album-cover";
          image.src = resolveMotifImagePath(group.image || motif.image);
          image.alt = group.name + " motif";
          link.appendChild(image);

          const title = document.createElement("span");
          title.className = "album-title";
          title.textContent = group.name || motif.name;
          link.appendChild(title);

          return tile;
        }

        function getMotifCategory(group) {
          const motifType = String(group && group.type ? group.type : "").toLowerCase();

          if (motifType === "lyrical") {
            return "lyrical";
          }

          if (motifType === "sample") {
            return "sample";
          }

          return "motif";
        }

        function createMotifSection(headingText, groups) {
          const section = document.createElement("section");

          const heading = document.createElement("h2");
          heading.className = "album-section-heading";
          heading.textContent = headingText;
          section.appendChild(heading);

          const gallery = document.createElement("div");
          gallery.className = "albumgallery";
          section.appendChild(gallery);

          groups.forEach((group) => {
            gallery.appendChild(createMotifTile(group));
          });

          return section;
        }

        const sectionsRoot = document.getElementById("motifSections");
        const motifs =
          window.MotifData && Array.isArray(window.MotifData.allMotifGroups)
            ? window.MotifData.allMotifGroups
            : [];

        if (!sectionsRoot || motifs.length === 0) {
          return;
        }

        const motifsWithPages = motifs.filter((group) => {
          if (!group || group.hasPage === false) {
            return false;
          }

          return Boolean(String(group.pageSlug || group.id || "").trim());
        });

        const verifiedMotifs = motifsWithPages;

        const categorized = {
          motif: [],
          lyrical: [],
          sample: [],
        };

        verifiedMotifs.forEach((group) => {
          const category = getMotifCategory(group);
          if (!categorized[category]) {
            categorized.motif.push(group);
            return;
          }

          categorized[category].push(group);
        });

        const sections = [
          { key: "motif", heading: "Motifs" },
          { key: "lyrical", heading: "Lyrical References" },
          { key: "sample", heading: "Samples" },
        ];

        sectionsRoot.innerHTML = "";
        sections.forEach((section) => {
          const motifsForSection = categorized[section.key] || [];
          if (motifsForSection.length === 0) {
            return;
          }

          sectionsRoot.appendChild(createMotifSection(section.heading, motifsForSection));
        });
        if (typeof window.__jamiepediaMarkPageReady === "function") {
          window.__jamiepediaMarkPageReady("motifs-index");
        }
      })();
    </script>
  </body>
</html>
